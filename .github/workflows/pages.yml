name: Publish design catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build catalog and single-design downloads
        run: npm run build:catalog
        env:
          CATALOG_SITE_URL: ${{ steps.pages.outputs.origin }}
          CATALOG_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Verify catalog links and downloads
        run: npm run verify:catalog
        env:
          CATALOG_SITE_URL: ${{ steps.pages.outputs.origin }}
          CATALOG_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish catalog
        id: deployment
        uses: actions/deploy-pages@v5
